syntax = "proto3";

package aegis.v1;

option go_package = "github.com/aegisrun/aegisrun/control-go/pkg/pb;pb";

service SandboxWorker {
  rpc ExecuteTool(ExecutionRequest) returns (stream ExecutionEvent);
  rpc CancelExecution(CancelRequest) returns (CancelResponse);
  rpc StreamWorkerHeartbeat(Empty) returns (stream WorkerHeartbeat);
}

enum RuntimeType {
  RUNTIME_TYPE_UNSPECIFIED = 0;
  PYTHON_3_12 = 1;
  NODE_20 = 2;
  BASH_5 = 3;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  STARTED = 1;
  STDOUT_CHUNK = 2;
  STDERR_CHUNK = 3;
  COMPLETED = 4;
  OOM_KILLED = 5;
  TIMEOUT_KILLED = 6;
  SYSCALL_VIOLATION = 7;
  INTERNAL_ERROR = 8;
}

enum WorkerStatus {
  WORKER_STATUS_UNSPECIFIED = 0;
  HEALTHY = 1;
  DEGRADED = 2;
  DRAINING = 3;
}

message Empty {}

message ResourceLimits {
  uint32 wall_timeout_ms = 1;
  uint64 memory_max_bytes = 2;
  uint32 cpu_quota_us = 3;
  uint32 pids_max = 4;
  uint64 tmpfs_size_bytes = 5;
}

message ExecutionRequest {
  string execution_id = 1;
  RuntimeType runtime = 2;
  string entrypoint_code = 3;
  bytes stdin_payload = 4;
  map<string, string> env_vars = 5;
  ResourceLimits limits = 6;
  bool enable_loopback_only = 7;
}

message ExecutionMetrics {
  int32 exit_code = 1;
  int32 signaled = 2;
  uint64 setup_duration_us = 3;
  uint64 exec_duration_us = 4;
  uint64 teardown_duration_us = 5;
  uint64 peak_memory_bytes = 6;
  uint64 cpu_usage_us = 7;
}

message ExecutionEvent {
  string execution_id = 1;
  uint64 sequence_num = 2;
  uint64 timestamp_ns = 3;
  EventType event_type = 4;
  bytes chunk_data = 5;
  ExecutionMetrics metrics = 6;
  string error_message = 7;
}

message CancelRequest {
  string execution_id = 1;
  string reason = 2;
}

message CancelResponse {
  bool cancelled = 1;
  string message = 2;
}

message WorkerHeartbeat {
  string worker_node_id = 1;
  uint32 active_sandboxes = 2;
  uint32 max_sandboxes = 3;
  uint64 available_memory_bytes = 4;
  uint64 total_memory_bytes = 5;
  double cpu_pressure_psi = 6;
  double memory_used_pct = 7;
  WorkerStatus status = 8;
  uint64 timestamp_ns = 9;
}

