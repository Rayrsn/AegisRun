[package]
name = "daemon-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "AegisRun privileged Linux sandbox worker daemon"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/aegisrun/aegisrun"
keywords = ["sandbox", "cgroups", "seccomp", "overlayfs", "grpc"]
categories = ["os::linux-apis", "network-programming", "asynchronous"]

[lib]
name = "daemon_rs"
path = "src/lib.rs"

[[bin]]
name = "daemon-rs"
path = "src/main.rs"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["fs", "mount", "sched", "signal", "user", "process", "resource", "hostname", "uio"] }
prost = "0.13"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "v7"] }

[build-dependencies]
protoc-bin-vendored = "3.0"
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
