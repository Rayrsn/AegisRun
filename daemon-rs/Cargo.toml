[package]
name = "daemon-rs"
version = "0.1.0"
edition = "2021"
description = "AegisRun privileged Linux sandbox worker daemon"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["fs", "mount", "sched", "signal", "user", "process", "resource", "hostname", "uio"] }
prost = "0.13"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "v7"] }

[build-dependencies]
protoc-bin-vendored = "3.0"
tonic-build = "0.12"
